name: Titan-UX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

      - name: Check Node QA script syntax
        run: node --check scripts/browser_audit.mjs

      - name: Check bash installer syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n install.sh
